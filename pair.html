<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ℭ𝔜𝔅𝔈ℜ_𝔅𝔒𝔗 · JJJ DEV</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      font-family: 'Inter', sans-serif;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Main card */
    .container {
      max-width: 520px;
      width: 100%;
      background: #0d1117;
      border-radius: 2rem;
      padding: 1.8rem;
      border: 1px solid #30363d;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 1rem;
      background: #00FFAA;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #0d1117;
      box-shadow: 0 0 12px rgba(0,255,170,0.3);
    }
    .title {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #00FFAA 0%, #00cc88 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 1.2rem;
    }

    /* Social Icons (dark mode, neon touches) */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }
    .social-icons a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #161b22;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e6edf3;
      font-size: 1.2rem;
      transition: all 0.25s ease;
      text-decoration: none;
      border: 1px solid #30363d;
    }
    .social-icons a:hover {
      background: #00FFAA;
      color: #0d1117;
      border-color: #00FFAA;
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(0,255,170,0.2);
    }

    /* Toggle switch (pair / qr) */
    .toggle-container {
      display: flex;
      background: #161b22;
      border-radius: 60px;
      padding: 4px;
      margin-bottom: 2rem;
      border: 1px solid #30363d;
    }
    .toggle-option {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      color: #8b949e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .toggle-option i {
      font-size: 1rem;
    }
    .toggle-option.active {
      background: #00FFAA;
      color: #0d1117;
      box-shadow: 0 2px 8px rgba(0,255,170,0.2);
    }
    .toggle-option:not(.active):hover {
      color: #e6edf3;
    }

    /* Input group */
    .input-group {
      margin-bottom: 1.5rem;
      transition: 0.2s;
    }
    .input-group.hidden {
      display: none;
    }
    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #c9d1d9;
      letter-spacing: 0.3px;
    }
    .input-field {
      width: 100%;
      padding: 12px 16px;
      background: #0d1117;
      border: 1.5px solid #30363d;
      border-radius: 16px;
      color: #e6edf3;
      font-size: 0.95rem;
      font-family: 'Inter', monospace;
      transition: 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #00FFAA;
      box-shadow: 0 0 0 3px rgba(0,255,170,0.1);
    }

    /* Buttons */
    .generate-btn {
      width: 100%;
      background: #00FFAA;
      border: none;
      padding: 12px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 1.2rem;
    }
    .generate-btn:hover {
      background: #00e699;
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0,255,170,0.3);
    }
    .generate-btn.hidden {
      display: none;
    }

    /* Code / QR boxes */
    .code-display {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 1.2rem;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-display {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 1.2rem;
      display: none;
    }
    .qr-image {
      max-width: 240px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: white;
      padding: 8px;
    }
    .qr-instructions {
      font-size: 0.8rem;
      color: #8b949e;
      line-height: 1.4;
    }
    .success-message {
      color: #00FFAA;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
    }
    .error-message {
      color: #ff7b72;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .copy-btn {
      width: 100%;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 40px;
      font-weight: 600;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 0.5rem;
    }
    .copy-btn:hover {
      background: #2d333b;
      border-color: #00FFAA;
      color: #00FFAA;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 1rem 0;
    }
    .loading i {
      color: #00FFAA;
      font-size: 1.6rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #6e7681;
      border-top: 1px solid #21262d;
      padding-top: 1rem;
    }

    /* Responsive */
    @media (max-width: 500px) {
      body {
        padding: 1rem;
      }
      .container {
        padding: 1.2rem;
      }
      .title {
        font-size: 1.6rem;
      }
      .code-display {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><i class="fas fa-robot"></i></div>
    <h1 class="title">ℭ𝔜𝔅𝔈ℜ_𝔅𝔒𝔗</h1>
    <p class="subtitle">Link your WhatsApp device — secure & fast</p>
    <div class="social-icons">
      <a href="javascript:void(0)" class="youtube"><i class="fab fa-youtube"></i></a>
      <a href="tel:09065296638" class="telephone"><i class="fas fa-phone-alt"></i></a>
      <a href="https://whatsapp.com/channel/0029VbC1l5Z4CrfkBufJQm30" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
      <a href="https://github.com/Cyberboyjj/" target="_blank" class="github"><i class="fab fa-github"></i></a>
    </div>
  </div>

  <!-- Toggle Pair / QR -->
  <div class="toggle-container">
    <div class="toggle-option active" data-mode="pair">
      <i class="fas fa-key"></i> Pair Code
    </div>
    <div class="toggle-option" data-mode="qr">
      <i class="fas fa-qrcode"></i> QR Code
    </div>
  </div>

  <div class="input-group" id="inputGroup">
    <label class="input-label">📱 WhatsApp number (with country code)</label>
    <input type="tel" id="mobileNumber" class="input-field" placeholder="+2349065296638" pattern="[+][0-9]{10,}">
  </div>

  <button class="generate-btn" id="submit">
    <i class="fas fa-key"></i> Generate Pair Code
  </button>

  <div class="loading" id="loading">
    <i class="fas fa-circle-notch"></i>
  </div>

  <div class="code-display" id="codeDisplay">
    Your pair code will appear here
  </div>

  <div class="qr-display" id="qrDisplay">
    <img id="qrImage" class="qr-image" alt="QR Code">
    <div class="qr-instructions" id="qrInstructions">
      Scan this QR with WhatsApp (Linked Devices)
    </div>
  </div>

  <button class="copy-btn" id="copy">
    <i class="fas fa-copy"></i> Copy Code
  </button>

  <div class="footer">
    © 2027 JJJ DEV — Julius Joshua Okpanachi
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
<script>
  let currentMode = 'pair';

  // Toggle switch logic
  document.querySelectorAll('.toggle-option').forEach(opt => {
    opt.addEventListener('click', function() {
      const mode = this.dataset.mode;
      if (mode === currentMode) return;

      document.querySelectorAll('.toggle-option').forEach(o => o.classList.remove('active'));
      this.classList.add('active');
      currentMode = mode;

      const submitBtn = document.getElementById('submit');
      const inputGroup = document.getElementById('inputGroup');
      const codeDisplay = document.getElementById('codeDisplay');
      const qrDisplay = document.getElementById('qrDisplay');

      if (mode === 'pair') {
        submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
        submitBtn.classList.remove('hidden');
        inputGroup.classList.remove('hidden');
        codeDisplay.style.display = 'flex';
        qrDisplay.style.display = 'none';
        codeDisplay.innerHTML = 'Your pair code will appear here';
      } else {
        submitBtn.classList.add('hidden');
        inputGroup.classList.add('hidden');
        codeDisplay.style.display = 'none';
        generateQRCode();
      }
    });
  });

  // Generate QR (calls /qr endpoint)
  async function generateQRCode() {
    const loadingSpinner = document.getElementById('loading');
    const qrDisplay = document.getElementById('qrDisplay');
    const codeDisplay = document.getElementById('codeDisplay');
    loadingSpinner.style.display = 'block';
    qrDisplay.style.display = 'none';
    codeDisplay.style.display = 'none';

    try {
      const response = await axios('/qr');
      if (response.data.qr) {
        document.getElementById('qrImage').src = response.data.qr;
        const instructions = response.data.instructions || ['Scan this QR code with WhatsApp > Linked Devices'];
        document.getElementById('qrInstructions').innerHTML = instructions.join('<br>');
        qrDisplay.style.display = 'block';
      } else {
        codeDisplay.style.display = 'flex';
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Failed to fetch QR</div>';
      }
    } catch (err) {
      console.error(err);
      codeDisplay.style.display = 'flex';
      codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> QR service error. Try again later.</div>';
    } finally {
      loadingSpinner.style.display = 'none';
    }
  }

  // Pair code generation
  document.getElementById('submit').addEventListener('click', async (e) => {
    e.preventDefault();
    const mobileInput = document.getElementById('mobileNumber');
    const numberRaw = mobileInput.value.trim();
    if (!numberRaw) {
      document.getElementById('codeDisplay').innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter your WhatsApp number</div>';
      document.getElementById('codeDisplay').style.display = 'flex';
      return;
    }
    const cleanNumber = numberRaw.replace(/[^0-9]/g, '');
    const loadingSpinner = document.getElementById('loading');
    const codeDisplay = document.getElementById('codeDisplay');
    const qrDisplay = document.getElementById('qrDisplay');
    loadingSpinner.style.display = 'block';
    qrDisplay.style.display = 'none';
    codeDisplay.style.display = 'flex';

    try {
      const response = await axios(`/pair?number=${cleanNumber}`);
      const code = response.data.code || 'Service Unavailable';
      if (code === 'Service Unavailable') {
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-ban"></i> Service Unavailable. Try later.</div>';
      } else {
        codeDisplay.innerHTML = `<div class="success-message"><i class="fas fa-check-circle"></i> CODE: ${code}</div>`;
      }
    } catch (error) {
      console.error(error);
      codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating code. Check network or backend.</div>';
    } finally {
      loadingSpinner.style.display = 'none';
    }
  });

  // Copy code function
  document.getElementById('copy').addEventListener('click', () => {
    const codeDiv = document.getElementById('codeDisplay');
    let codeText = '';
    if (codeDiv.innerText.includes('CODE:')) {
      codeText = codeDiv.innerText.split('CODE:')[1].trim();
    } else if (codeDiv.innerText !== 'Your pair code will appear here' && !codeDiv.innerText.includes('Error')) {
      codeText = codeDiv.innerText.replace(/[^0-9]/g, '');
    } else {
      codeText = '';
    }
    if (!codeText) {
      const temp = document.createElement('div');
      temp.innerHTML = '<div class="error-message"><i class="fas fa-times-circle"></i> No valid code to copy</div>';
      codeDiv.innerHTML = temp.innerHTML;
      setTimeout(() => {
        if (currentMode === 'pair') codeDiv.innerHTML = '<div class="success-message"><i class="fas fa-check-circle"></i> CODE: (generate first)</div>';
        else codeDiv.innerHTML = 'Your pair code will appear here';
      }, 1500);
      return;
    }
    navigator.clipboard.writeText(codeText).then(() => {
      const copyBtn = document.getElementById('copy');
      const original = copyBtn.innerHTML;
      copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
      setTimeout(() => {
        copyBtn.innerHTML = original;
      }, 1800);
    }).catch(() => {
      alert('Could not copy manually');
    });
  });
</script>
</body>
</html>
