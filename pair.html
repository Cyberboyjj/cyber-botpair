<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>ℭ𝔜𝔅𝔈ℜ_𝔅𝔒𝔗 • JJJ DEV</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a0a12, #030308);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .glass-card {
      max-width: 520px;
      width: 100%;
      background: rgba(12, 12, 20, 0.75);
      backdrop-filter: blur(18px);
      border-radius: 48px;
      padding: 26px 20px 32px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo-ring {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      background: linear-gradient(145deg, #1e1e30, #0b0b14);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0f0ff, #b0b0ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 500;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      display: inline-block;
      padding-top: 6px;
    }

    /* ANIMATED JJJ DEV BADGE */
    .jjjdev-wrapper {
      display: flex;
      justify-content: center;
      margin: 12px 0 10px;
    }
    .jjjdev {
      font-family: 'Monoton', 'Courier New', monospace;
      font-size: 1.9rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ffb347, #ff6b6b, #a55dff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 3px;
      animation: glitchFloat 3s infinite ease-in-out, gradientShift 6s infinite alternate;
      text-shadow: 0 0 5px rgba(255,80,120,0.5);
      display: inline-block;
      transform-origin: center;
    }

    @keyframes glitchFloat {
      0% { transform: translateY(0px) scale(1); opacity: 0.9; text-shadow: -2px 0 red, 2px 0 blue; }
      25% { transform: translateY(-3px) scale(1.02); text-shadow: -1px 0 cyan, 1px 0 magenta; }
      50% { transform: translateY(2px) scale(0.98); text-shadow: 1px 0 lime, -1px 0 violet; }
      75% { transform: translateY(-1px) scale(1.01); text-shadow: -2px 0 orange, 2px 0 deepskyblue; }
      100% { transform: translateY(0px) scale(1); text-shadow: -1px 0 red, 1px 0 blue; }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 18px 0 20px;
    }

    .social-icons a {
      width: 48px;
      height: 48px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e0e0ff;
    }

    .social-icons a.youtube { background: #ff0000aa; color: white; }
    .social-icons a.telephone { background: #34b7f1aa; color: white; }
    .social-icons a.whatsapp { background: #25d366aa; color: white; }
    .social-icons a.github { background: #181717aa; color: white; }

    .social-icons a:hover {
      transform: translateY(-5px);
      filter: brightness(1.1);
    }

    .toggle-modern {
      display: flex;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 60px;
      padding: 5px;
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toggle-option {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      background: transparent;
      color: #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .toggle-option.active {
      background: #2c2c3e;
      color: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .input-group {
      margin-bottom: 22px;
    }

    .input-group.hidden {
      display: none;
    }

    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #cfcfef;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: rgba(10, 10, 18, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      font-size: 16px;
      color: #f0f0ff;
      outline: none;
    }

    .input-field:focus {
      border-color: #8b8bff;
      box-shadow: 0 0 0 3px rgba(139, 139, 255, 0.2);
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(100deg, #2b2b4f, #1e1e34);
      border: none;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .generate-btn:hover {
      transform: scale(0.98);
      background: linear-gradient(100deg, #3b3b6f, #2a2a48);
    }

    .generate-btn.hidden {
      display: none;
    }

    .code-display {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 60px;
      padding: 16px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #d6d6ff;
    }

    .qr-display {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 36px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
      display: none;
    }

    .qr-image {
      max-width: 240px;
      width: 100%;
      border-radius: 24px;
      background: white;
      padding: 10px;
      margin-bottom: 12px;
    }

    .qr-instructions {
      font-size: 12px;
      color: #bdbde2;
    }

    .copy-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #cdcdff;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #8b8bff;
    }

    .loading {
      text-align: center;
      margin: 14px 0;
      display: none;
    }

    .loading i {
      font-size: 26px;
      color: #a0a0ff;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-message { color: #a3ffb0; }
    .error-message { color: #ffa8a8; }

    .footer {
      text-align: center;
      margin-top: 26px;
      font-size: 11px;
      color: #5f5f8a;
    }
  </style>
</head>
<body>
<div class="glass-card">
  <div class="header">
    <div class="logo-ring"><i class="fas fa-crown"></i></div>
    <h1 class="title">ℭ𝔜𝔅𝔈ℜ_𝔅𝔒𝔗</h1>
    <div class="subtitle">pair • secure • instant</div>
  </div>

  <div class="jjjdev-wrapper">
    <div class="jjjdev">⚡ JJJ DEV ⚡</div>
  </div>

  <div class="social-icons">
    <a href="javascript:void(0)" class="youtube"><i class="fab fa-youtube"></i></a>
    <a href="tel:09065296638" class="telephone"><i class="fas fa-phone-alt"></i></a>
    <a href="https://whatsapp.com/channel/0029VbC1l5Z4CrfkBufJQm30" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
    <a href="https://github.com/Cyberboyjj/" target="_blank" class="github"><i class="fab fa-github"></i></a>
  </div>

  <div class="toggle-modern">
    <div class="toggle-option active" data-mode="pair"><i class="fas fa-key"></i> Pair Code</div>
    <div class="toggle-option" data-mode="qr"><i class="fas fa-qrcode"></i> QR Code</div>
  </div>

  <div class="input-group" id="inputGroup">
    <label class="input-label">📞 WhatsApp number (with country code)</label>
    <input type="tel" id="mobileNumber" class="input-field" placeholder="+2348123456789">
  </div>

  <button class="generate-btn" id="submit"><i class="fas fa-link"></i> Generate Pair Code</button>

  <div class="loading" id="loading"><i class="fas fa-spinner"></i> processing...</div>

  <div class="code-display" id="codeDisplay">✨ enter your number and tap generate</div>
  <div class="qr-display" id="qrDisplay">
    <img id="qrImage" class="qr-image" alt="QR Code">
    <div class="qr-instructions" id="qrInstructions">Scan with WhatsApp → Linked Devices</div>
  </div>

  <button class="copy-btn" id="copy"><i class="fas fa-copy"></i> Copy Code</button>
  <div class="footer">© 2027 JJJ DEV | animated by JJJ DEV</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
<script>
  let currentMode = 'pair';

  const toggleOptions = document.querySelectorAll('.toggle-option');
  const inputGroup = document.getElementById('inputGroup');
  const submitBtn = document.getElementById('submit');
  const codeDiv = document.getElementById('codeDisplay');
  const qrDiv = document.getElementById('qrDisplay');
  const loading = document.getElementById('loading');
  const qrImage = document.getElementById('qrImage');
  const qrInstructions = document.getElementById('qrInstructions');

  toggleOptions.forEach(opt => {
    opt.addEventListener('click', () => {
      const mode = opt.dataset.mode;
      if (mode === currentMode) return;
      currentMode = mode;
      toggleOptions.forEach(o => o.classList.remove('active'));
      opt.classList.add('active');

      if (mode === 'pair') {
        inputGroup.classList.remove('hidden');
        submitBtn.classList.remove('hidden');
        qrDiv.style.display = 'none';
        codeDiv.style.display = 'flex';
        codeDiv.innerHTML = '📱 enter number & generate code';
      } else {
        inputGroup.classList.add('hidden');
        submitBtn.classList.add('hidden');
        codeDiv.style.display = 'none';
        generateQRCode();
      }
    });
  });

  async function generateQRCode() {
    loading.style.display = 'block';
    qrDiv.style.display = 'none';
    codeDiv.style.display = 'none';
    try {
      const res = await axios('/qr');
      if (res.data.qr) {
        qrImage.src = res.data.qr;
        qrInstructions.innerHTML = res.data.instructions.join('<br>');
        qrDiv.style.display = 'block';
      } else {
        codeDiv.style.display = 'flex';
        codeDiv.innerHTML = '<span class="error-message">⚠️ QR generation failed</span>';
      }
    } catch (err) {
      codeDiv.style.display = 'flex';
      codeDiv.innerHTML = '<span class="error-message">❌ QR error, try again</span>';
    } finally {
      loading.style.display = 'none';
    }
  }

  document.getElementById("submit").addEventListener("click", async (e) => {
    e.preventDefault();
    let rawNumber = document.getElementById("mobileNumber").value.trim();
    
    rawNumber = rawNumber.replace(/[-\s]/g, '');
    
    if (!rawNumber.startsWith('+')) {
      codeDiv.innerHTML = '<span class="error-message">⚠️ Include country code starting with + (e.g., +2348123456789)</span>';
      codeDiv.style.display = 'flex';
      return;
    }
    
    const digitsOnly = rawNumber.replace(/[^0-9]/g, '');
    if (digitsOnly.length < 10) {
      codeDiv.innerHTML = '<span class="error-message">⚠️ Number too short — enter full international number</span>';
      codeDiv.style.display = 'flex';
      return;
    }
    
    if (digitsOnly.length > 15) {
      codeDiv.innerHTML = '<span class="error-message">⚠️ Number too long — max 15 digits</span>';
      codeDiv.style.display = 'flex';
      return;
    }
    
    loading.style.display = 'block';
    codeDiv.style.display = 'flex';
    qrDiv.style.display = 'none';
    codeDiv.innerHTML = '⏳ requesting pair code...';

    try {
      const numberDigits = digitsOnly;
      const response = await axios(`/pair?number=${numberDigits}`);
      const pairCode = response.data.code;
      
      if (pairCode && pairCode !== "Service Unavailable" && typeof pairCode === 'string' && pairCode.includes('-')) {
        codeDiv.innerHTML = `<span class="success-message"><i class="fas fa-check-circle"></i> CODE: ${pairCode}</span>`;
      } else if (pairCode && pairCode.includes("Invalid")) {
        codeDiv.innerHTML = `<span class="error-message">⚠️ ${pairCode}</span>`;
      } else {
        codeDiv.innerHTML = '<span class="error-message">🚫 Service unavailable or number invalid — check and retry</span>';
      }
    } catch (error) {
      console.error(error);
      let errorMsg = '🌐 Network / server error. Try again later.';
      if (error.response && error.response.data && error.response.data.code) {
        errorMsg = error.response.data.code;
      } else if (error.response && error.response.status === 400) {
        errorMsg = '❌ Invalid number format. Use full international number.';
      } else if (error.response && error.response.status === 503) {
        errorMsg = '⏳ Service busy. Please retry in a moment.';
      }
      codeDiv.innerHTML = `<span class="error-message">${errorMsg}</span>`;
    } finally {
      loading.style.display = 'none';
    }
  });

  // FIXED COPY FUNCTION - extracts any digit-dash code with at least 2 dashes
  function copyCode() {
    const rawText = codeDiv.innerText;
    // Match any sequence that contains digits and dashes, length at least 5, and has at least two dashes
    const match = rawText.match(/\b[\d\-]{5,}\b/);
    if (match && match[0].includes('-') && match[0].split('-').length >= 3) {
      const code = match[0];
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById("copy");
        const oldHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => btn.innerHTML = oldHtml, 1800);
      }).catch(() => alert("Manual copy required"));
    } else {
      const btn = document.getElementById("copy");
      const oldHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-times"></i> No valid code';
      setTimeout(() => btn.innerHTML = oldHtml, 1500);
    }
  }
  document.getElementById("copy").onclick = copyCode;
</script>
</body>
</html>
